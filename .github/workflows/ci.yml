name: CI

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Scan, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: pulseops_ci_password
          POSTGRES_DB: pulseops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseops -d pulseops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Ruff checks
        run: |
          ruff check .

      - name: Create dedicated test database
        run: |
          python -c "
          import psycopg
          conn = psycopg.connect('postgresql://pulseops:pulseops_ci_password@localhost:5432/pulseops', autocommit=True)
          with conn.cursor() as cur:
              cur.execute(\"SELECT 1 FROM pg_database WHERE datname = 'pulseops_test'\")
              if not cur.fetchone():
                  cur.execute('CREATE DATABASE pulseops_test;')
          conn.close()
          "

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://pulseops:pulseops_ci_password@localhost:5432/pulseops
          TEST_DATABASE_URL: postgresql+psycopg://pulseops:pulseops_ci_password@localhost:5432/pulseops_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          DATABASE_URL=postgresql+psycopg://pulseops:pulseops_ci_password@localhost:5432/pulseops alembic upgrade head
          DATABASE_URL=postgresql+psycopg://pulseops:pulseops_ci_password@localhost:5432/pulseops_test alembic upgrade head

      - name: Run pytest suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://pulseops:pulseops_ci_password@localhost:5432/pulseops
          TEST_DATABASE_URL: postgresql+psycopg://pulseops:pulseops_ci_password@localhost:5432/pulseops_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          export JWT_SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          export INTEGRATION_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          pytest -v
