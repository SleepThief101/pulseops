services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pulseops-api

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pulseops-worker

    working_dir: /app

    command: arq app.worker.WorkerSettings

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  db:
    image: postgres:16

    container_name: pulseops-db

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:
    image: redis:7

    container_name: pulseops-redis

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
